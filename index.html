<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Studio — Poster Berita</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--card:#fff;--tx:#1c2430;--mut:#68738a;--blue:#1a6be0;--blue2:#0f56b8;--line:#e3e8f2;--warnbg:#fdf3e0;--warntx:#8a5a00}
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui,sans-serif}
body{background:var(--bg);color:var(--tx)}
header{background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
header h1{font-size:1.05rem;font-weight:800;flex:1}
.burger{background:#f2f5fa;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:1rem}
.live{background:#101826;color:#fff;border-radius:99px;padding:7px 14px;font-size:.75rem;font-weight:700;display:flex;align-items:center;gap:7px}
.live .dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px #22c55e33}
.bell{position:relative;background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 11px;cursor:pointer;font-size:1rem}
.bell .cnt{position:absolute;top:-6px;right:-6px;background:#e5484d;color:#fff;border-radius:99px;font-size:.65rem;font-weight:800;padding:2px 6px}
.bellDrop{position:absolute;right:0;top:44px;width:320px;max-height:380px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px #0002;display:none;z-index:20}
.bellDrop.open{display:block}
.bellDrop div{padding:10px 12px;border-bottom:1px solid var(--line);font-size:.78rem;cursor:pointer}
.bellDrop div:hover{background:#f4f7fc}
.bellDrop .t{color:var(--mut);font-size:.68rem}
.wrap{display:flex;gap:16px;padding:16px;max-width:1400px;margin:0 auto;align-items:flex-start}
.side{width:360px;flex-shrink:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 2px 10px #0001}
.side label{display:block;font-size:.68rem;font-weight:800;letter-spacing:.06em;color:var(--mut);margin:14px 0 6px;text-transform:uppercase}
.side select,.side input[type=text]{width:100%;background:#f7f9fd;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:.82rem;color:var(--tx)}
.seg{display:flex;flex-wrap:wrap;gap:6px;background:#f2f5fa;border-radius:12px;padding:6px}
.seg button{flex:1;min-width:80px;border:none;background:transparent;border-radius:9px;padding:8px 6px;font-size:.75rem;font-weight:700;color:var(--mut);cursor:pointer}
.seg button.on{background:#fff;color:var(--blue);box-shadow:0 1px 5px #0002}
.ratio{display:flex;gap:6px;background:#f2f5fa;border-radius:12px;padding:6px}
.ratio button{flex:1;border:none;background:transparent;border-radius:9px;padding:8px 0;font-size:.75rem;font-weight:700;color:var(--mut);cursor:pointer}
.ratio button.on{background:#fff;color:var(--blue);box-shadow:0 1px 5px #0002}
.cta{width:100%;margin-top:16px;background:var(--blue);color:#fff;border:none;border-radius:12px;padding:13px;font-size:.9rem;font-weight:800;cursor:pointer}
.cta:hover{background:var(--blue2)}
.cta:disabled{opacity:.55;cursor:wait}
.note{margin-top:12px;background:var(--warnbg);color:var(--warntx);border-radius:10px;padding:10px 12px;font-size:.72rem;line-height:1.5}
.prev{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:12px}
.prev canvas{max-width:100%;max-height:78vh;border-radius:10px;box-shadow:0 10px 34px #0003;background:#0b1220}
.dl{background:#101826;color:#fff;border:none;border-radius:10px;padding:10px 18px;font-weight:700;font-size:.8rem;cursor:pointer}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#101826;color:#fff;border-radius:12px;padding:12px 18px;font-size:.8rem;max-width:90vw;display:none;z-index:50;box-shadow:0 10px 30px #0006}
@media(max-width:900px){.wrap{flex-direction:column}.side{width:100%}}
</style>
</head>
<body>
<header>
  <button class="burger" onclick="document.querySelector('.side').scrollIntoView({behavior:'smooth'})">☰</button>
  <h1>Image Studio</h1>
  <div class="live"><span class="dot"></span><span id="liveBadge">Memuat RSS…</span></div>
  <button class="bell" onclick="toggleBell()">🔔<span class="cnt" id="bellCnt">0</span>
    <div class="bellDrop" id="bellDrop"></div>
  </button>
</header>

<div class="wrap">
  <aside class="side">
    <label>Pilih Berita (RSS Live)</label>
    <select id="pilihBerita" onchange="pilihItem()"><option>Memuat berita…</option></select>

    <label>Judul di Foto</label>
    <input type="text" id="judul" placeholder="Judul yang akan dicetak di poster">

    <label>Sumber Visual</label>
    <div class="seg" id="segMode">
      <button data-m="auto">Otomatis 80/20</button>
      <button data-m="foto" class="on">Foto Asli</button>
      <button data-m="ai">Generate AI</button>
      <button data-m="upload">Upload</button>
    </div>
    <input type="file" id="fileUp" accept="image/*" hidden>

    <label>Style</label>
    <select id="style">
      <option value="editorial" selected>editorial Bandung football</option>
      <option value="bold">bold sport yellow</option>
      <option value="minimal">minimal clean</option>
      <option value="duotone">duotone biru</option>
    </select>

    <label>Aspect Ratio</label>
    <div class="ratio" id="segRatio">
      <button data-r="1:1">1:1</button><button data-r="4:5">4:5</button>
      <button data-r="16:9">16:9</button><button data-r="9:16" class="on">9:16</button>
    </div>

    <button class="cta" id="btnBuat" onclick="buatPoster()">🎨 Buat Poster</button>
    <div class="note">🖼️ Foto RSS milik media — kredit otomatis ditempel. Komersial = pastikan izin, atau pakai foto sendiri/AI. <b>Mode Foto Asli tidak pernah otomatis diganti AI.</b></div>
  </aside>

  <main class="prev">
    <canvas id="cv" width="1080" height="1920"></canvas>
    <button class="dl" onclick="unduh()">⬇ Unduh PNG</button>
  </main>
</div>
<div id="toast"></div>

<script>
// ================== KONFIG SUMBER RSS ==================
const FEEDS=[
['Persib.co.id','https://www.persib.co.id/feed'],['Kompas Bola','https://www.kompas.com/feed/bola'],
['Detik Sport','https://feed.detik.com/index.php/detik/olahraga'],['Antara Bola','https://www.antaranews.com/rss/bola'],
['Tribun Jabar','https://jabar.tribunnews.com/rss'],['Bola.com','https://www.bola.com/feed'],
['Bola.net','https://www.bola.net/feed'],['CNN Olahraga','https://www.cnnindonesia.com/olahraga/rss'],
['Okezone Bola','https://bola.okezone.com/rss'],['Sindonews Bola','https://bola.sindonews.com/rss'],
['Liputan6','https://www.liputan6.com/rss'],['Skor.id','https://skor.id/feed'],
['Republika Bola','https://www.republika.co.id/rss/bola'],['VIVA Bola','https://www.viva.co.id/rss/bola'],
['IDN Times Bola','https://www.idntimes.com/feed/bola'],['Suara Bola','https://www.suara.com/rss/bola'],
['Pikiran Rakyat','https://www.pikiran-rakyat.com/rss'],['Galamedia','https://www.galamedia.com/rss'],
['AyoBandung','https://www.ayobandung.com/rss'],['RMOL Jabar','https://www.rmoljabar.com/rss'],
['Tribun Bola','https://bola.tribunnews.com/rss'],['Football Tribe','https://footballtribe.com/indonesia/feed'],
['Tempo','https://www.tempo.co/rss/bola'],['Goal ID','https://www.goal.com/id/feed'],
['ESPN Soccer','https://www.espn.com/espn/rss/soccer/news']];
const RATIOS={'1:1':[1080,1080],'4:5':[1080,1350],'16:9':[1600,900],'9:16':[1080,1920]};
const STYLES={
 editorial:{accent:'#2f8bff',filter:'saturate(1.15) contrast(1.08)',tint:null,fs:.085,prompt:'professional sports editorial photograph, football stadium atmosphere, dramatic floodlights'},
 bold:{accent:'#ffd400',filter:'contrast(1.28) saturate(1.35)',tint:null,fs:.095,prompt:'high energy sports poster photo, vivid colors, stadium crowd, dramatic light'},
 minimal:{accent:'#ffffff',filter:'none',tint:null,fs:.06,prompt:'clean minimalist football photography, soft light, simple composition'},
 duotone:{accent:'#7db4ff',filter:'grayscale(1) contrast(1.25)',tint:'#0b3d91',fs:.085,prompt:'moody blue duotone football stadium photography'}};
let ITEMS=[],MODE='foto',RATIO='9:16',UPLOAD=null;
const $=id=>document.getElementById(id);
const prox=u=>'https://wsrv.nl/?url='+encodeURIComponent(u);
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._x);t._x=setTimeout(()=>t.style.display='none',4200);}
function loadImg(src,ms=15000){return new Promise((res,rej)=>{const i=new Image();i.crossOrigin='anonymous';
 const to=setTimeout(()=>{i.src='';rej(new Error('timeout'));},ms);
 i.onload=()=>{clearTimeout(to);res(i);};i.onerror=()=>{clearTimeout(to);rej(new Error('gagal memuat gambar'));};i.src=src;});}
function itemImage(el){let u='';const enc=el.getElementsByTagName('enclosure')[0];if(enc)u=enc.getAttribute('url')||'';
 if(!u){const mc=el.getElementsByTagName('media:content')[0];if(mc)u=mc.getAttribute('url')||'';}
 if(!u){const mt=el.getElementsByTagName('media:thumbnail')[0];if(mt)u=mt.getAttribute('url')||'';}
 if(!u){const d=el.getElementsByTagName('description')[0];const m=/<img[^>]+src=["']([^"']+)/i.exec(d?d.textContent:'');if(m)u=m[1];}
 return u||'';}

// ================== MUAT RSS ==================
async function muatRSS(){
 const res=await Promise.allSettled(FEEDS.map(async([name,url])=>{
  const r=await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(url),{signal:AbortSignal.timeout(12000)});
  if(!r.ok)throw 0;const txt=await r.text();
  const xml=new DOMParser().parseFromString(txt,'text/xml');
  if(xml.getElementsByTagName('parsererror').length)throw 0;
  const its=[...xml.getElementsByTagName('item')].slice(0,10).map(el=>{
   const g=t=>{const n=el.getElementsByTagName(t)[0];return n?n.textContent:'';};
   return{title:(g('title')||'').trim(),link:g('link'),date:new Date(g('pubDate')||Date.now()),image:itemImage(el),source:name};
  }).filter(x=>x.title);
  if(!its.length)throw 0;return its;}));
 let all=[],ok=0;res.forEach(r=>{if(r.status==='fulfilled'){ok++;all.push(...r.value);}});
 all.sort((a,b)=>b.date-a.date);ITEMS=all;
 $('liveBadge').textContent=`LIVE · ${ITEMS.length} berita · ${ok} sumber RSS`;
 const sel=$('pilihBerita');
 if(!ITEMS.length){sel.innerHTML='<option>Semua sumber RSS gagal dimuat</option>';toast('⚠️ RSS gagal dimuat. Cek koneksi / coba refresh.');return;}
 sel.innerHTML=ITEMS.map((it,i)=>`<option value="${i}">[BERITA] ${it.title.slice(0,70)}</option>`).join('');
 pilihItem();notif();}
function pilihItem(){const it=ITEMS[+$('pilihBerita').value||0];if(it)$('judul').value=it.title;}
function notif(){const fresh=ITEMS.filter(i=>Date.now()-i.date<48*36e5).slice(0,15);
 $('bellCnt').textContent=fresh.length;
 $('bellDrop').innerHTML=fresh.length?fresh.map(i=>{const idx=ITEMS.indexOf(i);
  return `<div onclick="pilihDariBell(${idx})"><b>${i.title.slice(0,80)}</b><div class="t">${i.source} · ${i.date.toLocaleString('id-ID')}</div></div>`;}).join(''):'<div>Tidak ada berita baru.</div>';}
function pilihDariBell(i){$('pilihBerita').value=i;pilihItem();$('bellDrop').classList.remove('open');}
function toggleBell(){$('bellDrop').classList.toggle('open');}

// ================== KONTROL MODE & RATIO ==================
document.querySelectorAll('#segMode button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('#segMode button').forEach(x=>x.classList.remove('on'));b.classList.add('on');MODE=b.dataset.m;
 if(MODE==='upload')$('fileUp').click();});
$('fileUp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=ev=>{UPLOAD=ev.target.result;toast('✅ Gambar upload siap dipakai.');};r.readAsDataURL(f);};
document.querySelectorAll('#segRatio button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('#segRatio button').forEach(x=>x.classList.remove('on'));b.classList.add('on');RATIO=b.dataset.r;});

// ================== BUAT POSTER ==================
async function buatPoster(){
 const it=ITEMS[+$('pilihBerita').value||0];if(!it){toast('Pilih berita dulu.');return;}
 const judul=$('judul').value.trim()||it.title;
 const[W,H]=RATIOS[RATIO];let img=null,kredit=it.source;
 $('btnBuat').disabled=true;$('btnBuat').textContent='Membuat…';
 try{
  if(MODE==='foto'){
   // ✅ PERBAIKAN: Foto Asli TIDAK pernah fallback ke AI.
   if(!it.image)throw new Error('RSS berita ini tidak menyertakan foto. Gunakan mode Upload atau Generate AI.');
   img=await loadImg(prox(it.image)).catch(()=>null);
   if(!img)throw new Error('Foto asli gagal dimuat (server media memblokir). Mode Foto Asli tidak memakai AI — coba mode Upload/Generate AI.');
  }else if(MODE==='ai'){
   img=await generateAI(judul,W,H);kredit='AI-generated';
  }else if(MODE==='upload'){
   if(!UPLOAD)throw new Error('Upload gambar dulu (pilih menu Upload).');
   img=await loadImg(UPLOAD);kredit='Dok. pribadi';
  }else{ // Otomatis 80/20
   if(it.image&&Math.random()<0.8)img=await loadImg(prox(it.image)).catch(()=>null);
   if(!img){img=await generateAI(judul,W,H);kredit='AI-generated';}
  }
  gambar(img,judul,kredit,W,H);
 }catch(e){toast('⚠️ '+e.message);}
 $('btnBuat').disabled=false;$('btnBuat').textContent='🎨 Buat Poster';}
function generateAI(judul,W,H){const st=STYLES[$('style').value];
 const prompt=`${st.prompt}, indonesian football, ${judul.slice(0,60)}, no text, no watermark`;
 return loadImg(`https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=${W}&height=${H}&nologo=true&seed=${Math.floor(Math.random()*1e6)}`,30000);}

// ================== GAMBAR POSTER ==================
function gambar(img,judul,kredit,W,H){
 const cv=$('cv');cv.width=W;cv.height=H;const ctx=cv.getContext('2d');const st=STYLES[$('style').value];
 ctx.filter=st.filter||'none';
 const iw=img.naturalWidth||W,ih=img.naturalHeight||H,s=Math.max(W/iw,H/ih),dw=iw*s,dh=ih*s;
 ctx.drawImage(img,(W-dw)/2,(H-dh)/2,dw,dh);ctx.filter='none';
 if(st.tint){ctx.globalAlpha=.28;ctx.fillStyle=st.tint;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
 const g=ctx.createLinearGradient(0,H*.45,0,H);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.88)');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 const M=W*.07;let fs=Math.round(W*st.fs);ctx.textBaseline='top';
 let lines;for(let k=0;k<4;k++){ctx.font=`900 ${fs}px 'Archivo Black','Arial Black',sans-serif`;
  lines=wrap(ctx,judul.toUpperCase(),W-M*2);if(lines.length<=6)break;fs=Math.round(fs*.88);}
 const lh=fs*1.18,th=lines.length*lh;
 const y0=H-M-W*.05-th;
 ctx.fillStyle=st.accent;ctx.fillRect(M,y0-W*.03,W*.16,W*.012);
 ctx.fillStyle='#fff';lines.forEach((l,i)=>ctx.fillText(l,M,y0+i*lh));
 ctx.font=`600 ${Math.round(W*.022)}px Inter,sans-serif`;ctx.fillStyle='rgba(255,255,255,.85)';
 ctx.fillText('Foto: '+kredit,M,H-M+ -W*.005);
 ctx.textAlign='right';ctx.fillText('Image Studio',W-M,H-M-W*.005);ctx.textAlign='left';}
function wrap(ctx,text,maxW){const w=text.split(/\s+/),lines=[];let cur='';
 for(const x of w){const t=cur?cur+' '+x:x;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=x;}else cur=t;}
 if(cur)lines.push(cur);return lines;}
function unduh(){const a=document.createElement('a');a.download='poster-'+Date.now()+'.png';a.href=$('cv').toDataURL('image/png');a.click();}

muatRSS();
gambarPlaceholder();
function gambarPlaceholder(){const cv=$('cv'),ctx=cv.getContext('2d');
 const g=ctx.createLinearGradient(0,0,0,1920);g.addColorStop(0,'#0b1220');g.addColorStop(1,'#12224a');
 ctx.fillStyle=g;ctx.fillRect(0,0,1080,1920);
 ctx.fillStyle='#2f8bff';ctx.fillRect(76,1500,180,14);
 ctx.fillStyle='#fff';ctx.font="900 92px 'Archivo Black','Arial Black',sans-serif";
 ['PILIH BERITA,','LALU TEKAN','BUAT POSTER'].forEach((l,i)=>ctx.fillText(l,76,1560+i*110));}
</script>
</body>
</html>
